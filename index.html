const grid = document.getElementById('signsGrid');
signs.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'sign-btn';
  btn.dataset.id = s.id;
  btn.innerHTML = `<span class="sign-sym">${s.symbol}</span><span class="sign-nm">${s.name}</span>`;
  btn.onclick = () => selectSign(s);
  grid.appendChild(btn);
});

function selectSign(s) {
  currentSign = s.id;
  document.querySelectorAll('.sign-btn').forEach(b => b.classList.toggle('active', b.dataset.id === s.id));
  renderForecast();
}

function renderForecast() {
  const area = document.getElementById('forecastArea');
  const sign = signs.find(s => s.id === currentSign);
  area.innerHTML = `
    <div class="forecast visible">
      <div class="forecast-head">
        <div class="forecast-sym">${sign.symbol}</div>
        <div class="forecast-meta">
          <h2>${sign.name}</h2>
          <p>${sign.dates} &nbsp;·&nbsp; Прогноз на лето 2026</p>
        </div>
      </div>
      <div class="months-tabs">
        <button class="month-tab ${currentMonth==='june'?'active':''}" onclick="switchMonth('june')">Июнь</button>
        <button class="month-tab ${currentMonth==='july'?'active':''}" onclick="switchMonth('july')">Июль</button>
        <button class="month-tab ${currentMonth==='august'?'active':''}" onclick="switchMonth('august')">Август</button>
      </div>
      ${renderMonth(currentSign, currentMonth)}
      ${renderCTA()}
    </div>
  `;
}

function renderMonth(signId, month) {
  const d = data[signId][month];
  return `
    <div>
      <div class="section">
        <div class="section-lbl">${sectionLabels.energy}</div>
        <div class="section-txt">${d.energy}</div>
      </div>
      <div class="section-grid">
        <div class="section">
          <div class="section-lbl">${sectionLabels.work}</div>
          <div class="section-txt">${d.work}</div>
        </div>
        <div class="section">
          <div class="section-lbl">${sectionLabels.money}</div>
          <div class="section-txt">${d.money}</div>
        </div>
      </div>
      <div class="section">
        <div class="section-lbl">${sectionLabels.love}</div>
        <div class="section-txt">${d.love}</div>
      </div>
    </div>
  `;
}

window.switchMonth = function(month) {
  currentMonth = month;
  renderForecast();
};
</script>
